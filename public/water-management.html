<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Management | Sakura Elite</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header class="admin-header">
        <div class="header-brand">
            <div class="brand-logo">SE</div>
            <div>
                <div class="brand-name">Sakura Elite</div>
                <div class="brand-sub">Water Management</div>
            </div>
        </div>
        <nav class="header-nav">
            <span id="currentMonthDisplay" class="month-badge">—</span>
            <button id="backBtn" class="nav-link" style="background:none;border:none;cursor:pointer;">&#8592; Admin</button>
            <button id="logoutBtn" class="btn btn-outline">Logout</button>
        </nav>
    </header>

    <div class="admin-body">

        <div id="successMessage" class="page-msg page-msg-success"></div>
        <div id="errorMessage"   class="page-msg page-msg-error"></div>

        <!-- Summary stat cards -->
        <div class="stats-strip">
            <div class="stat-card">
                <div class="stat-label">Tankers This Month</div>
                <div class="stat-value" id="totalTankers">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Liters</div>
                <div class="stat-value" id="totalLiters">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Cost</div>
                <div class="stat-value stat-collected" id="totalCost">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Price per Liter</div>
                <div class="stat-value" id="pricePerLiter">—</div>
            </div>
        </div>

        <!-- Add tanker -->
        <div class="card">
            <div class="card-inner-header">
                <h2>Add New Tanker</h2>
            </div>
            <div class="card-body">
                <form id="addTankerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="tankerDate" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Liters</label>
                            <input type="number" id="tankerLiters" required class="form-input" placeholder="e.g. 5000">
                        </div>
                        <div class="form-group">
                            <label>Cost (₹)</label>
                            <input type="number" step="0.01" id="tankerCost" required class="form-input" placeholder="e.g. 500">
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <input type="text" id="tankerNotes" class="form-input" placeholder="Optional">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Tanker</button>
                </form>
            </div>
        </div>

        <!-- Tanker history -->
        <div class="card">
            <div class="card-inner-header">
                <h2>Tanker History</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Month</th>
                            <th>Liters</th>
                            <th>Cost (₹)</th>
                            <th>Notes</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tankerHistoryBody">
                        <tr><td colspan="6" class="empty-state">Loading&hellip;</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Meter readings -->
        <div class="card">
            <div class="card-header">
                <div class="card-title-group">
                    <h2>Unit Meter Readings</h2>
                </div>
                <div class="card-actions">
                    <button id="calculateWaterBillsBtn" class="btn btn-primary">Calculate &amp; Update Water Bills</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Unit</th>
                            <th>Start Reading</th>
                            <th>End Reading</th>
                            <th>Liters Consumed</th>
                            <th>Cost (₹)</th>
                        </tr>
                    </thead>
                    <tbody id="meterReadingsBody">
                        <tr><td colspan="5" class="empty-state">Loading&hellip;</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="water-management.js"></script>
</body>
</html>
